<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">HTTP Tunnel</title>
  <desc id="desc">A minimal tunnel connection mark.</desc>
  <defs>
    <linearGradient id="bg" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d91ff"/>
      <stop offset="1" stop-color="#005ecb"/>
